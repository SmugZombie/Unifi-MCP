name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: unifi-mcp:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run -d --name smoke -p 127.0.0.1:3000:3000 --read-only --tmpfs /tmp --cap-drop ALL \
            -e UNIFI_HOST=https://192.0.2.1 -e UNIFI_API_KEY=dummy \
            -e MCP_AUTH_TOKEN=ci-token-0123456789abcdef0123 unifi-mcp:ci
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:3000/healthz && break; sleep 1; done
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:3000/mcp)
          test "$code" = 401 || { echo "expected 401 without token, got $code"; docker logs smoke; exit 1; }
          curl -sf -H 'content-type: application/json' -H 'accept: application/json, text/event-stream' \
            -H 'authorization: Bearer ci-token-0123456789abcdef0123' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' http://127.0.0.1:3000/mcp | grep -q unifi_block_client
          echo "smoke test passed"
